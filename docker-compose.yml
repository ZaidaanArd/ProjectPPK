services:
  db:
    image: postgres:17-alpine
    container_name: project-ppk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppk
      POSTGRES_USER: ppk
      POSTGRES_PASSWORD: ppk
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - ppk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppk -d ppk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ppk-postgres-data:
